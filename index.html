<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>春日裕次</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      line-height: 1.7;
    }

    header {
      background-color: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 48px 24px;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1rem;
      color: #777;
    }

    main {
      max-width: 680px;
      margin: 48px auto;
      padding: 0 24px;
    }

    section {
      background-color: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 32px;
      margin-bottom: 24px;
    }

    section h2 {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 16px;
    }

    section p {
      font-size: 0.95rem;
      color: #444;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill-tag {
      background-color: #f0f0f0;
      color: #444;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    footer {
      text-align: center;
      padding: 32px;
      font-size: 0.8rem;
      color: #bbb;
    }
  </style>
</head>
<body>

  <header>
    <h1>春日裕次</h1>
    <p>Yuji Kasuga</p>
  </header>

  <main>
    <section>
      <h2>About</h2>
      <p>大学生です。プログラミングや技術に興味を持ち、日々学習しています。</p>
    </section>

    <section>
      <h2>Skills</h2>
      <div class="skills">
        <span class="skill-tag">Python</span>
        <span class="skill-tag">MATLAB</span>
        <span class="skill-tag">JavaScript</span>
        <span class="skill-tag">Git</span>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 春日裕次</p>
  </footer>

</body>
</html>
