<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>春日裕次</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent: #e8f0fe;
      --accent-border: #c5d5f8;
      --accent-text: #4a6fa5;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
      line-height: 1.7;
    }

    header {
      padding: 80px 24px 64px;
      text-align: center;
      background: linear-gradient(180deg, var(--accent) 0%, #ffffff 100%);
      border-bottom: 1px solid var(--accent-border);
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    header .en-name {
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: #aaa;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--accent-text);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      padding: 8px 16px;
      border: 1px solid var(--accent-border);
      border-radius: 999px;
      background-color: #fff;
      transition: all 0.2s;
    }

    .social-links a:hover {
      background-color: var(--accent);
      border-color: var(--accent-text);
    }

    main {
      max-width: 640px;
      margin: 64px auto;
      padding: 0 24px;
    }

    section {
      margin-bottom: 56px;
    }

    section h2 {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-text);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--accent-border);
    }

    section p {
      font-size: 0.95rem;
      color: #444;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill-tag {
      color: var(--accent-text);
      background-color: var(--accent);
      border: 1px solid var(--accent-border);
      border-radius: 4px;
      padding: 6px 16px;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .works-grid {
      display: grid;
      gap: 24px;
    }

    .work-item p {
      font-size: 0.85rem;
      color: #888;
      margin-top: 10px;
      letter-spacing: 0.03em;
    }

    .work-item video {
      width: 100%;
      border-radius: 6px;
      border: 1px solid var(--accent-border);
    }

    footer {
      text-align: center;
      padding: 48px 24px;
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 0.1em;
      border-top: 1px solid var(--accent-border);
      background-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <h1>春日裕次</h1>
    <p class="en-name">Yuji Kasuga</p>
    <div class="social-links">
      <a href="https://x.com/YujiKasuga88667" target="_blank" rel="noopener">
        X (Twitter)
      </a>
    </div>
  </header>

  <main>
    <section>
      <h2>About</h2>
      <p>大学生です。プログラミングや技術に興味を持ち、日々学習しています。</p>
    </section>

    <section>
      <h2>Works</h2>
      <div class="works-grid">
        <div class="work-item">
          <video controls poster="works/thumbnail.jpg">
            <source src="works/OCプレゼン.mp4" type="video/mp4">
          </video>
          <p>OCプレゼン</p>
        </div>
      </div>
    </section>

    <section>
      <h2>Skills</h2>
      <div class="skills">
        <span class="skill-tag">Python</span>
        <span class="skill-tag">MATLAB</span>
        <span class="skill-tag">JavaScript</span>
        <span class="skill-tag">Git</span>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Yuji Kasuga</p>
  </footer>

</body>
</html>
